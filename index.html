<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiérarchie</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            color: #050505;
        }
        /* Top Navigation Style Facebook Mobile/Desktop */
        header {
            background-color: #ffffff;
            height: 56px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            color: #e41e3f; /* Le rouge Hiérarchie */
            letter-spacing: -1.5px;
        }
        .nav-icons {
            display: flex;
            gap: 15px;
        }
        .nav-icon {
            font-size: 1.2rem;
            background: #f0f2f5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container principal */
        .main-container {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px;
        }

        /* Boîte de publication style Facebook */
        .fb-create-box {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .fb-create-top {
            display: flex;
            gap: 10px;
            align-items: center;
            border-bottom: 1px solid #e4e6eb;
            padding-bottom: 10px;
        }
        .fb-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e41e3f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .fb-input-fake {
            background: #f0f2f5;
            border: none;
            border-radius: 20px;
            padding: 10px 15px;
            width: 100%;
            font-size: 0.95rem;
            color: #65676b;
            outline: none;
        }
        .fb-create-bottom {
            display: flex;
            justify-content: space-around;
            padding-top: 8px;
        }
        .fb-action-btn {
            background: none;
            border: none;
            font-weight: 600;
            color: #65676b;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Fil d'actualité - Posts */
        .fb-post {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            margin-bottom: 12px;
            padding-top: 12px;
        }
        .fb-post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            margin-bottom: 8px;
        }
        .fb-post-user-info {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .fb-post-name {
            font-weight: bold;
            font-size: 0.95rem;
        }
        .fb-post-time {
            font-size: 0.75rem;
            color: #65676b;
        }
        .badge-elite {
            background: #ffebee;
            color: #e41e3f;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 4px;
        }
        .fb-post-body {
            padding: 0 16px 12px 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            color: #050505;
        }
        .fb-post-footer {
            border-top: 1px solid #e4e6eb;
            display: flex;
            justify-content: space-around;
            padding: 6px 0;
            color: #65676b;
            font-weight: 600;
            font-size: 0.85rem;
        }

        /* Bouton de suppression Élites */
        .elite-delete-btn {
            background: #ffebee;
            color: #e41e3f;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barre de navigation supérieure -->
    <header>
        <div class="logo">Hiérarchie</div>
        <div class="nav-icons">
            <button class="nav-icon">🏠</button>
            <button class="nav-icon">👑</button>
            <button class="nav-icon">🛒</button>
            <button class="nav-icon">⚙️</button>
        </div>
    </header>

    <div class="main-container">
        <!-- Boîte de publication style FB -->
        <div class="fb-create-box">
            <div class="fb-create-top">
                <div class="fb-avatar">H</div>
                <input type="text" id="postInput" class="fb-input-fake" placeholder="Exprimez-vous au sommet ou subissez..." onkeypress="checkEnter(event)">
            </div>
            <div class="fb-create-bottom">
                <button class="fb-action-btn">🔴 Vidéo en direct</button>
                <button class="fb-action-btn" onclick="createPost()">📸 Photo/vidéo</button>
                <button class="fb-action-btn">🔥 Humeur</button>
            </div>
        </div>

        <!-- Flux de posts -->
        <div id="feedContainer">
            <div class="fb-post" id="post-1">
                <div class="fb-post-header">
                    <div class="fb-post-user-info">
                        <div class="fb-avatar" style="width: 32px; height: 32px; font-size: 0.8rem;">TL</div>
                        <div>
                            <div class="fb-post-name">Thomas Leroy <span class="badge-elite" style="background:#f0f2f5; color:#65676b;">Plebe</span></div>
                            <div class="fb-post-time">Il y a 2 minutes</div>
                        </div>
                    </div>
                    <!-- Pouvoir des Élites -->
                    <button class="elite-delete-btn" onclick="removePost('post-1')">⚡ Supprimer (Élite)</button>
                </div>
                <div class="fb-post-body">
                    Est-ce que les membres du sommet vont encore supprimer mon message ? Test de résistance sur Hiérarchie.
                </div>
                <div class="fb-post-footer">
                    <div>👍 J'aime</div>
                    <div>💬 Commenter</div>
                    <div>↗️ Partager</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function createPost() {
            const text = document.getElementById('postInput').value;
            if(!text.trim()) return;

            const container = document.getElementById('feedContainer');
            const postId = 'post-' + Date.now();

            const postHTML = `
                <div class="fb-post" id="${postId}">
                    <div class="fb-post-header">
                        <div class="fb-post-user-info">
                            <div class="fb-avatar" style="width: 32px; height: 32px; font-size: 0.8rem;">MOI</div>
                            <div>
                                <div class="fb-post-name">Moi <span class="badge-elite">Élite</span></div>
                                <div class="fb-post-time">À l'instant</div>
                            </div>
                        </div>
                        <button class="elite-delete-btn" onclick="removePost('${postId}')">⚡ Supprimer (Élite)</button>
                    </div>
                    <div class="fb-post-body">${text}</div>
                    <div class="fb-post-footer">
                        <div>👍 J'aime</div>
                        <div>💬 Commenter</div>
                        <div>↗️ Partager</div>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('afterbegin', postHTML);
            document.getElementById('postInput').value = '';
        }

        function checkEnter(e) {
            if(e.key === 'Enter') {
                createPost();
            }
        }

        function removePost(id) {
            const el = document.getElementById(id);
            if(el) el.remove();
        }
    </script>

</body>
</html>
