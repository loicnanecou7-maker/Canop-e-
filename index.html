<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinée & Numérologie - Rapport Exclusif</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1f2833;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            border: 1px solid #c5a059;
            text-align: center;
        }
        h1 {
            color: #66fcf1;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        p {
            color: #c5c6c7;
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #c5a059;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #45a29e;
            background: #0b0c10;
            color: #fff;
            font-size: 1rem;
        }
        .price-tag {
            font-size: 1.5rem;
            color: #66fcf1;
            margin: 20px 0;
            font-weight: bold;
        }
        .btn-stripe {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #c5a059 0%, #997430 100%);
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(197, 160, 89, 0.4);
        }
        .btn-stripe:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Découvrez votre Destinée</h1>
        <p>Entrez vos coordonnées pour générer votre analyse numérologique personnalisée et révéler les 3 grands tournants de votre année.</p>
        
        <div class="form-group">
            <label for="name">Votre Prénom :</label>
            <input type="text" id="name" placeholder="Ex: Thomas">
        </div>

        <div class="form-group">
            <label for="dob">Votre Date de Naissance :</label>
            <input type="date" id="dob">
        </div>

        <div class="price-tag">9,90 € <span style="font-size:0.9rem; text-decoration:line-through; color:#888;">29,00 €</span></div>

        <!-- REMplace le lien ci-dessous par ton vrai lien Stripe -->
        <a href="TON_LIEN_STRIPE_ICI" class="btn-stripe" id="payButton">Obtenir mon rapport complet</a>

        <div class="footer-note">🔒 Paiement sécurisé via Stripe • Résultat immédiat</div>
    </div>

    <script>
        // Petite sécurité pour s'assurer que le prénom est rempli avant d'aller sur Stripe
        document.getElementById('payButton').addEventListener('click', function(e) {
            const name = document.getElementById('name').value;
            if(!name) {
                e.preventDefault();
                alert("Veuillez entrer votre prénom pour continuer.");
            }
        });
    </script>

</body>
</html>
