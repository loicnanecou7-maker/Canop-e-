<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CANOPÉE — Adoptez un arbre, changez le monde</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #176b48;
            --green-light: #59b36c;
            --green-pale: #e9f5e8;
            --ink: #173126;
            --gold: #b88732;
            --gold-light: #f5d98a;
            --card: #ffffff;
            --shadow: rgba(23, 49, 38, 0.15);
            --radius: 20px;
            --font-display: 'Fraunces', Georgia, serif;
            --font-body: 'Inter', -apple-system, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            font-family: var(--font-body);
            background: var(--green-pale);
            color: var(--ink);
            touch-action: none;
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== APP ===== */
        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        header {
            height: 72px;
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 1px 20px rgba(21, 69, 37, 0.10);
            z-index: 50;
            border-bottom: 1px solid rgba(23, 49, 38, 0.06);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 900;
            font-family: var(--font-display);
        }

        .brand .logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--green), var(--green-light));
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(23, 107, 72, 0.25);
        }

        .brand span {
            color: var(--green);
        }

        nav {
            display: flex;
            gap: 6px;
        }

        nav button {
            padding: 10px 14px;
            border-radius: 12px;
            background: transparent;
            color: #587064;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-family: var(--font-body);
            white-space: nowrap;
        }

        nav button:hover {
            background: var(--green-pale);
            color: var(--green);
        }

        nav button.active {
            background: var(--green);
            color: #fff;
            box-shadow: 0 4px 12px rgba(23, 107, 72, 0.25);
        }

        nav button.adminBtn {
            background: #fff5df !important;
            color: #9b6c1e !important;
        }

        nav button.adminBtn.active {
            background: var(--gold) !important;
            color: #fff !important;
        }

        /* ===== MAIN ===== */
        .main {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        /* ===== MAP ===== */
        #map {
            position: absolute;
            inset: 0;
            overflow: hidden;
            touch-action: none;
            cursor: grab;
            background:
                radial-gradient(circle at 18% 30%, rgba(255, 255, 255, 0.4) 0 2px, transparent 3px),
                radial-gradient(ellipse at 50% 55%, #c7e8d7 0%, #eaf7ee 52%, #d9eee3 100%);
            background-size: 95px 95px, 100% 100%;
        }

        #map:active {
            cursor: grabbing;
        }

        #world {
            position: absolute;
            inset: -10%;
            width: 120%;
            height: 120%;
            transform-origin: center;
            transition: transform 0.05s linear;
        }

        /* ===== CONTINENTS ===== */
        .land {
            position: absolute;
            background: linear-gradient(145deg, #d4e8b7, #9ecb8b);
            border: 1px solid rgba(78, 140, 100, 0.2);
            box-shadow: 0 15px 30px rgba(46, 116, 68, 0.15);
            border-radius: 8px;
            transition: all 0.3s;
        }

        .land:hover {
            box-shadow: 0 20px 40px rgba(46, 116, 68, 0.2);
            filter: brightness(1.02);
        }

        .na {
            left: 9%;
            top: 17%;
            width: 26%;
            height: 30%;
            clip-path: polygon(5% 20%, 30% 0, 72% 9%, 100% 37%, 77% 70%, 59% 100%, 25% 83%, 8% 53%);
        }

        .sa {
            left: 30%;
            top: 48%;
            width: 14%;
            height: 34%;
            clip-path: polygon(20% 0, 80% 10%, 100% 35%, 75% 93%, 40% 100%, 7% 43%);
        }

        .eu {
            left: 48%;
            top: 19%;
            width: 15%;
            height: 14%;
            clip-path: polygon(0 39%, 25% 8%, 78% 0, 100% 42%, 77% 100%, 30% 87%);
        }

        .af {
            left: 48%;
            top: 37%;
            width: 18%;
            height: 34%;
            clip-path: polygon(30% 0, 80% 12%, 100% 53%, 70% 100%, 22% 87%, 0 36%);
        }

        .as {
            left: 60%;
            top: 18%;
            width: 31%;
            height: 31%;
            clip-path: polygon(0 28%, 20% 4%, 83% 0, 100% 34%, 88% 74%, 49% 100%, 7% 74%);
        }

        .au {
            left: 78%;
            top: 66%;
            width: 16%;
            height: 14%;
            clip-path: polygon(10% 18%, 68% 0, 100% 43%, 80% 88%, 28% 100%, 0 55%);
        }

        .label {
            position: absolute;
            font-size: clamp(11px, 1.8vw, 17px);
            letter-spacing: 3px;
            font-weight: 700;
            color: rgba(35, 98, 68, 0.5);
            pointer-events: none;
            font-family: var(--font-display);
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.5);
        }

        /* ===== MARKERS ===== */
        #markers {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .marker {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #fff;
            display: grid;
            place-items: center;
            font-size: 24px;
            box-shadow: 0 8px 20px rgba(23, 79, 48, 0.25);
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: var(--font-body);
        }

        .marker:hover,
        .marker:active {
            transform: translate(-50%, -50%) scale(1.18);
            z-index: 25;
        }

        .marker.common {
            outline: 3px solid #74b96d;
            outline-offset: 2px;
        }

        .marker.rare {
            outline: 3px solid #2ca4d2;
            outline-offset: 2px;
        }

        .marker.epic {
            outline: 3px solid #d3a13c;
            outline-offset: 2px;
            animation: epicPulse 2.6s ease-in-out infinite;
        }

        .marker.ephemeral {
            outline: 3px solid #ef7d4e;
            outline-offset: 2px;
            animation: ephemeralPulse 1.8s ease-in-out infinite;
        }

        @keyframes epicPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(211, 161, 60, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(211, 161, 60, 0.5);
            }
        }

        @keyframes ephemeralPulse {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(239, 125, 78, 0.3);
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                box-shadow: 0 0 50px rgba(239, 125, 78, 0.6);
                transform: translate(-50%, -50%) scale(1.08);
            }
        }

        .marker.owned {
            outline-color: var(--green) !important;
            box-shadow: 0 0 0 8px rgba(23, 107, 72, 0.2), 0 8px 20px rgba(23, 79, 48, 0.25) !important;
        }

        .marker .tooltip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--ink);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            font-weight: 600;
        }

        .marker:hover .tooltip {
            opacity: 1;
        }

        /* ===== HUD ===== */
        .hud {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            gap: 8px;
            z-index: 30;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 14px;
            min-width: 120px;
            box-shadow: 0 8px 20px rgba(23, 79, 48, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat span {
            font-size: 11px;
            color: #637d70;
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .stat b {
            display: block;
            font-size: 20px;
            color: var(--green);
            font-family: var(--font-mono);
            margin-top: 2px;
        }

        .stat .icon {
            font-size: 16px;
            margin-right: 4px;
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: absolute;
            right: 16px;
            bottom: 20px;
            display: grid;
            gap: 8px;
            z-index: 30;
        }

        .controls button {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            font-size: 22px;
            color: var(--green);
            box-shadow: 0 4px 16px rgba(23, 79, 48, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s;
            display: grid;
            place-items: center;
            font-family: var(--font-body);
        }

        .controls button:hover {
            transform: scale(1.05);
            background: #fff;
        }

        .controls button:active {
            transform: scale(0.92);
        }

        /* ===== PANEL ===== */
        .panel {
            position: absolute;
            right: 16px;
            top: 16px;
            bottom: 16px;
            width: min(380px, calc(100vw - 32px));
            z-index: 40;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 20px 60px rgba(22, 60, 38, 0.2);
            overflow-y: auto;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s;
        }

        .panel.show {
            display: block;
            animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        .panel::-webkit-scrollbar {
            width: 4px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 4px;
        }

        .close {
            float: right;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #eef6eb;
            color: var(--green);
            font-size: 20px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: grid;
            place-items: center;
        }

        .close:hover {
            background: var(--green);
            color: #fff;
            transform: rotate(90deg);
        }

        .treeimg {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 14px;
            margin: 10px 0;
            background: var(--green-pale);
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            background: #e6f5e4;
            color: var(--green);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .tag.epic {
            background: #f5e6b8;
            color: #8a6a20;
        }

        .tag.rare {
            background: #d4e8f5;
            color: #1a6e8a;
        }

        .tag.ephemeral {
            background: #f5d4c4;
            color: #8a3e1a;
            animation: flashTag 1.8s ease-in-out infinite;
        }

        @keyframes flashTag {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .price {
            font-size: 28px;
            font-weight: 900;
            color: var(--green);
            margin: 12px 0;
            font-family: var(--font-mono);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .box {
            background: #f1f8ef;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid rgba(23, 107, 72, 0.06);
        }

        .box span {
            display: block;
            font-size: 10px;
            color: #698175;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .box b {
            font-size: 16px;
            font-family: var(--font-mono);
        }

        .primary,
        .secondary,
        .danger {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            margin-top: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: var(--font-body);
            font-size: 14px;
        }

        .primary {
            background: linear-gradient(135deg, var(--green), var(--green-light));
            color: #fff;
            box-shadow: 0 6px 20px rgba(23, 107, 72, 0.25);
        }

        .primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(23, 107, 72, 0.35);
        }

        .primary:active {
            transform: scale(0.97);
        }

        .secondary {
            background: #edf6ea;
            color: var(--green);
        }

        .secondary:hover {
            background: #dce8d8;
        }

        .danger {
            background: #fff0eb;
            color: #bd5137;
        }

        .danger:hover {
            background: #fde8e0;
        }

        /* ===== ADMIN PANEL ===== */
        #adminPanel {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 35;
            width: 260px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: 0 12px 40px rgba(23, 79, 48, 0.15);
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #adminPanel b {
            display: block;
            font-size: 16px;
            color: var(--green);
            font-family: var(--font-mono);
        }

        #adminPanel .adminGrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }

        #adminPanel .adminGrid div {
            padding: 8px 10px;
            border-radius: 10px;
            background: #eef6eb;
            font-size: 10px;
            font-weight: 600;
            color: #587064;
        }

        #adminPanel .adminGrid div b {
            font-size: 18px;
        }

        #adminPanel small {
            display: block;
            margin-top: 10px;
            font-size: 10px;
            color: #698175;
            line-height: 1.4;
        }

        /* ===== MODALS ===== */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 47, 34, 0.6);
            backdrop-filter: blur(6px);
            display: none;
            place-items: center;
            z-index: 100;
            padding: 18px;
        }

        .overlay.show {
            display: grid;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            background: #fff;
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            animation: modalSlide 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal::-webkit-scrollbar {
            width: 4px;
        }

        .modal::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 4px;
        }

        .field {
            margin: 12px 0;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #61786d;
            margin-bottom: 4px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d7e5d3;
            border-radius: 12px;
            background: #fbfdf9;
            font-family: var(--font-body);
            font-size: 14px;
            transition: all 0.2s;
            color: var(--ink);
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--green);
            box-shadow: 0 0 0 3px rgba(23, 107, 72, 0.
